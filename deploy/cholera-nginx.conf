server {
    listen 80;
    server_name cholera.abokiwise.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cholera.abokiwise.ai;

    ssl_certificate /etc/letsencrypt/live/cholera.abokiwise.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cholera.abokiwise.ai/privkey.pem;

    client_max_body_size 25M;

    # API -> FastAPI backend on :8010
    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # health/docs passthrough
    location = /health { proxy_pass http://127.0.0.1:8010/health; }
    location /docs { proxy_pass http://127.0.0.1:8010/docs; }
    location /openapi.json { proxy_pass http://127.0.0.1:8010/openapi.json; }

    # Frontend SPA
    root /var/www/cholera;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
